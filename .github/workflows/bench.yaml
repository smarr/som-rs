name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  rebench:
    name: Run and report benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Temporarily modify the rust toolchain version
        run: rustup override set 1.87.0

      - name: Compile SOM interpreter
        run: cargo build --release -p som-interpreter-ast -p som-interpreter-bc

      - name: Install ReBench
        run: |
          pip install rebench

      - name: Run and report benchmarks
        run: |
          export PATH="${PATH}:${HOME}/.local/bin"
          rebench --experiment="CI Benchmark Run ID ${GITHUB_RUN_ID}" --branch="${GITHUB_REF}" -c rebench.conf som-rs
