name: Tests

on: [push, pull_request]

jobs:
  run_test_suite:
    name: Run SOM Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        interpreter:
          - som-interpreter-ast
          - som-interpreter-bc
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Temporarily modify the rust toolchain version
        run: rustup override set 1.87.0

      - name: Compile SOM interpreter
        run: cargo build --release -p ${{ matrix.interpreter }}

      - name: Run test suite
        run: |
          ./target/release/${{ matrix.interpreter }} -cp core-lib/Smalltalk:core-lib/TestSuite core-lib/TestSuite/TestHarness.som

  run_own_tests:
    name: Run own tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Temporarily modify the rust toolchain version
        run: rustup override set 1.87.0

      - name: Run all tests
        run: cargo test
        env:
          RUST_TEST_THREADS: 1
